<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="A top-down Checkers Sixty60 delivery driving prototype."><title>Checkers Sixty60 · Delivery City</title><meta name="theme-color" content="#173d32"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="touch.css"></head>
<body><canvas id="city" aria-label="Top-down delivery driving game"></canvas><div class="vignette"></div>
<header class="brand"><img src="assets/checkers-sixty60.png" alt="Checkers Sixty60" width="112" height="112"></header>
<div id="toast" role="status" aria-live="polite"></div>
<aside class="ride-hud" aria-label="Motorbike instruments"><div class="speed" id="speedometer" role="img" aria-label="Speedometer: 0 kilometres per hour"><svg class="speed-dial" viewBox="0 0 160 160" aria-hidden="true"><circle class="dial-bezel" cx="80" cy="80" r="75"/><circle class="dial-face" cx="80" cy="80" r="70"/><line class="dial-tick major" x1="42.52" y1="117.48" x2="34.04" y2="125.96"/><line class="dial-tick" x1="30.94" y1="112.78" x2="25.95" y2="116.11"/><line class="dial-tick" x1="28.26" y1="101.43" x2="19.95" y2="104.87"/><line class="dial-tick" x1="22.13" y1="91.51" x2="16.25" y2="92.68"/><line class="dial-tick major" x1="27" y1="80" x2="15" y2="80"/><line class="dial-tick" x1="22.13" y1="68.49" x2="16.25" y2="67.32"/><line class="dial-tick" x1="28.26" y1="58.57" x2="19.95" y2="55.13"/><line class="dial-tick" x1="30.94" y1="47.22" x2="25.95" y2="43.89"/><line class="dial-tick major" x1="42.52" y1="42.52" x2="34.04" y2="34.04"/><line class="dial-tick" x1="47.22" y1="30.94" x2="43.89" y2="25.95"/><line class="dial-tick" x1="58.57" y1="28.26" x2="55.13" y2="19.95"/><line class="dial-tick" x1="68.49" y1="22.13" x2="67.32" y2="16.25"/><line class="dial-tick major" x1="80" y1="27" x2="80" y2="15"/><line class="dial-tick" x1="91.51" y1="22.13" x2="92.68" y2="16.25"/><line class="dial-tick" x1="101.43" y1="28.26" x2="104.87" y2="19.95"/><line class="dial-tick" x1="112.78" y1="30.94" x2="116.11" y2="25.95"/><line class="dial-tick major" x1="117.48" y1="42.52" x2="125.96" y2="34.04"/><line class="dial-tick" x1="129.06" y1="47.22" x2="134.05" y2="43.89"/><line class="dial-tick" x1="131.74" y1="58.57" x2="140.05" y2="55.13"/><line class="dial-tick" x1="137.87" y1="68.49" x2="143.75" y2="67.32"/><line class="dial-tick major" x1="133" y1="80" x2="145" y2="80"/><text class="dial-number" x="49.59" y="113.91">0</text><text class="dial-number" x="37" y="83.50">20</text><text class="dial-number" x="49.59" y="53.09">40</text><text class="dial-number limit" x="80" y="40.50">60</text><text class="dial-number" x="110.41" y="53.09">80</text><text class="dial-number" x="123" y="83.50">100</text><text class="dial-unit" x="80" y="105">km/h</text><g id="speedNeedle" class="speed-needle"><path d="M78 89 79 30 Q80 25 81 30L82 89Z"/></g><circle class="needle-hub" cx="80" cy="80" r="6"/><circle class="needle-pin" cx="80" cy="80" r="2.4"/></svg></div><div id="fuelGauge" class="fuel-gauge" role="img" aria-label="Fuel: 100 percent"><svg viewBox="0 0 160 160" aria-hidden="true"><circle class="dial-bezel" cx="80" cy="80" r="75"/><circle class="dial-face" cx="80" cy="80" r="70"/><g class="fuel-pump-backdrop"><path d="M56 52h36v48H56zM52 100h44v6H52z"/><path d="M92 62h8l9 11v22q0 9-8 9t-8-9V82h-1" fill="none" stroke="currentColor" stroke-width="5"/><path d="m99 59 11 13" fill="none" stroke="currentColor" stroke-width="6"/><rect x="62" y="59" width="24" height="16" fill="#090d0b"/></g><path class="fuel-arc" d="M25 90 A56 56 0 1 1 135 90"/><text class="dial-number" x="32" y="109">E</text><text class="dial-number" x="128" y="109">F</text><text class="dial-number" x="80" y="36">½</text><g id="fuelNeedle" class="fuel-needle"><path d="M78 89 79 35 Q80 30 81 35L82 89Z"/></g><circle class="needle-hub" cx="80" cy="80" r="6"/><circle class="fuel-warning" cx="80" cy="111" r="5"/><text id="fuelStatusLabel" class="dial-unit" x="80" y="132">FUEL</text></svg></div></aside>
<section class="phone" id="phone" aria-label="Delivery phone"><div class="phone-camera"></div><div class="phone-app"><b>Sixty60</b><span id="phoneMode">Online</span><button id="phoneToggle" class="phone-toggle" aria-label="Expand delivery phone" aria-expanded="false"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 8V3h5m4 0h5v5m0 4v5h-5m-4 0H3v-5"/></svg></button></div><div class="phone-wallet"><span>WALLET</span><b id="credits">R 0.00</b></div><div id="fuelPrompt" class="fuel-prompt hidden" aria-live="polite"><div class="label">PETROL STATION</div><h3 id="fuelPromptTitle">Buy Petrol</h3><p id="fuelPromptInfo"></p><button id="buyPetrol" onclick="buyPetrol()">Buy Petrol</button></div><div id="phoneContent"></div><div class="homebar"></div></section>
<button class="phone-shade" id="phoneShade" aria-label="Close expanded phone"></button>
<div class="touch-controls" aria-label="Touch driving controls">
 <div class="steering-pad"><button data-drive="a" aria-label="Steer left"><span class="touch-glyph">←</span><span class="touch-label">LEFT</span></button><button data-drive="d" aria-label="Steer right"><span class="touch-glyph">→</span><span class="touch-label">RIGHT</span></button></div>
 <button class="reverse-control" data-drive="s" aria-label="Reverse"><span class="touch-glyph">↓</span><span class="touch-label">REV</span></button>
 <div class="pedal-pad"><button data-drive=" " aria-label="Brake"><span class="touch-glyph">▰</span><span class="touch-label">BRAKE</span></button><button data-drive="w" class="gas-control" aria-label="Accelerate"><span class="touch-glyph">↑</span><span class="touch-label">GAS</span></button></div>
 <button id="touchAction" class="touch-action" aria-label="Open delivery phone"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 7 9-4 9 4-9 5zM3 7v10l9 4 9-4V7M12 12v9m-5-16 9 5"/></svg><span id="touchActionLabel" class="touch-label">Phone</span></button>
 <div class="touch-tools"><button id="mapTouch" aria-label="Toggle city map" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 5 6-2 6 3 6-2v15l-6 2-6-3-6 2zM9 3v15m6-12v15"/></svg></button><button id="fullscreenTouch" aria-label="Toggle full screen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9V3h6m6 0h6v6m0 6v6h-6m-6 0H3v-6"/></svg></button></div>
</div>
<div id="fuelAlert" class="hidden" role="alert">OUT OF FUEL</div><div id="rotatePrompt" class="hidden" role="status"><div><span class="rotate-icon">↻</span><h2>Rotate your phone</h2><p>Turn to landscape to ride.<br>Your shift is paused while you rotate.</p></div></div><div id="overlay" class="hidden"><div><span class="eyebrow" id="overlayLabel">PAUSED</span><h2 id="overlayTitle">Taking a break.</h2><p id="overlayText">Your shift is paused.</p><button id="resume">Back to the road</button></div></div>
<script src="environment.js"></script><script src="town.js"></script><script src="vehicles.js"></script><script src="traffic.js"></script><script src="input.js"></script><script src="fuel.js"></script><script src="checkers.js"></script><script src="customers.js"></script><script src="game.js"></script></body></html>
